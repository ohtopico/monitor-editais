name: Monitor de editais

on:
  schedule:
    # 9h e 18h no horário de Brasília (UTC-3)
    - cron: "0 12 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Procurar editais e avisar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
        run: python -m monitor
      - name: Salvar o que já foi avisado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados docs
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza editais [skip ci]"
            git push
          fi
